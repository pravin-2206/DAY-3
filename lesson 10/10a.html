<!DOCTYPE html>
<html>
<head>
    <title>Oliver</title>

    <style>
        .container {
            width: 700px;
            height: 150px;
            border: 1px solid black;
            padding: 20px;
        }

        .img {
            display: inline-block;
            vertical-align: middle;
            width: 180px;
        }

        .img img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
        }

        .para {
            display: inline-block;
            vertical-align: middle;
            width: 250px;
        }

        .para p {
            margin: 8px;
        }

        .Oliver {
            font-size: 30px;
            font-weight: bold;
        }

        .cat,
        .popular {
            font-size: 25px;
            color: gray;
        }

        .button {
            display: inline-block;
            vertical-align: middle;
        }

        button {
            background-color: #4285e8;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 25px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="img">
            <img src="cat.jpg" alt="cat">
        </div>

        <div class="para">
            <p class="Oliver">Oliver</p>
            <p class="cat">the cat</p>
            <p class="popular">Popular</p>
        </div>

        <div class="button">
            <button>Follow</button>
        </div>

    </div>

</body>
</html>
