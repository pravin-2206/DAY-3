<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oliver Profile</title>

    <style>
        .container {
            width: 340px;
            border: 1px solid #ddd;
            box-shadow: 0 2px 10px gray;
            display: inline-block;
            margin: 10px 20px;
            border: none;
            border-radius: 2px;
        }
        .img img {
            width: 340px;
            height: 340px;
            object-fit: cover;
        }

        .head {
            padding: 10px 15px;
        }
        .head p {
            font-size: 30px;
            font-weight: bold;
            margin: 5px 0 15px;
        }

        .img2 {
            display: inline-block;
            vertical-align: middle;
        }
        .img2 img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
        }
        .friends {
            display: inline-block;
            vertical-align: middle;
            margin-left: 10px;
            font-size: 22px;
            color: gray;
        }
        .button {
            padding: 10px 15px 20px;
        }
        button {
            background-color: #3877e8;
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 22px;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="img">
            <img src="cat.jpg" alt="Oliver">
        </div>
        <div class="head">
            <p>Oliver</p>
            <div class="img2">
                <img src="cat.jpg" alt="Friend">
            </div>
            <div class="friends">

        <div class="button">
